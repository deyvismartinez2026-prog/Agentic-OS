<script>const{useState,useEffect,useRef,useMemo,useCallback}=React,DAYS=[{id:"d1",n:1,date:"2027-01-01",dow:"Fri",weekday:"Friday",short:"Jan 1",long:"January 1",tag:"Travel",sun:["7:53 AM","5:39 PM"]},{id:"d2",n:2,date:"2027-01-02",dow:"Sat",weekday:"Saturday",short:"Jan 2",long:"January 2",tag:"Adventure Day",sun:["7:53 AM","5:40 PM"]},{id:"d3",n:3,date:"2027-01-03",dow:"Sun",weekday:"Sunday",short:"Jan 3",long:"January 3",tag:"Cabin Day",sun:["7:54 AM","5:41 PM"]},{id:"d4",n:4,date:"2027-01-04",dow:"Mon",weekday:"Monday",short:"Jan 4",long:"January 4",tag:"Mixed",sun:["7:54 AM","5:42 PM"]},{id:"d5",n:5,date:"2027-01-05",dow:"Tue",weekday:"Tuesday",short:"Jan 5",long:"January 5",tag:"Travel",sun:["7:54 AM","5:43 PM"]}],DAY=Object.fromEntries(DAYS.map(e=>[e.id,e])),TAGS=["Travel","Cabin Day","Adventure Day","Mixed"],TAG_TONE={Travel:"haze","Cabin Day":"spruce","Adventure Day":"ember",Mixed:"plum"},SLOTS=[{id:"morning",label:"Morning",range:"8\u201311:30 AM",start:480,end:690,icon:"sunrise"},{id:"midday",label:"Midday",range:"11:30 AM\u20132:30 PM",start:690,end:870,icon:"sun",nap:!0},{id:"afternoon",label:"Afternoon",range:"2:30\u20135:30 PM",start:870,end:1050,icon:"sunset"},{id:"evening",label:"Evening",range:"5:30\u20138:30 PM",start:1050,end:1230,icon:"moon"}],SLOT=Object.fromEntries(SLOTS.map(e=>[e.id,e])),NAP={start:750,end:870},STATUS={planned:{label:"Planned",icon:"dashed",next:"booked"},booked:{label:"Booked",icon:"ticket",next:"done"},done:{label:"Done",icon:"check",next:"skipped"},skipped:{label:"Skipped",icon:"skip",next:"planned"}},KINDS={travel:{label:"Travel",icon:"plane",tone:"haze"},drive:{label:"Drive",icon:"car",tone:"haze"},cabin:{label:"Cabin",icon:"cabin",tone:"spruce"},nap:{label:"Nap",icon:"moon",tone:"night"},meal:{label:"Meal",icon:"fork",tone:"ember"},custom:{label:"Other",icon:"pin",tone:"neutral"}},CAT_ICON={Indoor:"home",Outdoor:"tree",Food:"fork",Cabin:"cabin","Scenic Drive":"car","Shows/Lights":"sparkle",Shopping:"bag"},CAT_TONE={Indoor:"haze",Outdoor:"spruce",Food:"ember",Cabin:"spruce","Scenic Drive":"haze","Shows/Lights":"ember",Shopping:"plum"},ACTIVITIES=[{id:"anakeesta",name:"Anakeesta",area:"Gatlinburg",cats:["Outdoor","Shows/Lights"],icon:"sparkle",cost:"$$$",toddler:"Good",weather:"fair",dur:180,drive:20,stroller:"partial",setting:"Outdoor",slot:"afternoon",why:"Ride up in an enclosed gondola cabin. The mountaintop has a treehouse playground, gentle paved paths and holiday lights that switch on at dusk.",tips:"Head up around 3:30 PM to get daylight and then the lights at sunset (about 5:40 PM in early January). Strollers work on the paved paths; use a carrier on the Treetop Skywalk bridges. It is colder and windier on the ridge, so add a layer. Kids 3 and under are usually free.",check:"Holiday light dates, winter hours and ride status (wind, ice) change. Check before you go.",verify:!0,url:"https://anakeesta.com"},{id:"ripleys",name:"Ripley's Aquarium of the Smokies",area:"Gatlinburg",cats:["Indoor"],icon:"fish",cost:"$$$",toddler:"Great",weather:"any",dur:150,drive:20,stroller:"yes",setting:"Indoor",slot:"morning",why:"Warm, fully indoors and built at toddler height: a moving walkway through the shark tunnel, a penguin habitat with crawl-through tubes and pop-up viewing bubbles, and a stingray touch pool.",tips:"Arrive right at opening on New Year\u2019s weekend and buy timed tickets online. Park in a downtown garage nearby. Elevators, restrooms and changing tables inside. Children under 2 are usually free.",check:"Holiday-week hours can differ. Confirm the opening time.",verify:!1,url:"https://www.ripleyaquariums.com/gatlinburg/"},{id:"dollywood",name:"Dollywood Smoky Mountain Christmas",area:"Pigeon Forge",cats:["Outdoor","Shows/Lights"],icon:"sparkle",cost:"$$$",toddler:"Good",weather:"fair",dur:300,drive:25,stroller:"yes",setting:"Mixed",slot:"afternoon",why:"Millions of lights, cozy indoor Christmas shows, and whole kids\u2019 areas (Wildwood Grove, Country Fair) with gentle rides sized for toddlers.",tips:"Arrive late morning, let the littles nap in the stroller, then stay for the lights after 5:30 PM. Expect hills, so bring a stroller with good wheels (rentals are available). Kids 3 and under are free.",check:"Smoky Mountain Christmas usually ends in the first days of January, then the park closes until spring. Confirm it is open on your date before planning around it.",verify:!0,url:"https://www.dollywood.com"},{id:"island",name:"The Island in Pigeon Forge",area:"Pigeon Forge",cats:["Outdoor","Shows/Lights","Shopping","Food"],icon:"wheel",cost:"Free",toddler:"Great",weather:"fair",dur:150,drive:15,stroller:"yes",setting:"Outdoor",slot:"evening",why:"Free to walk, flat and stroller-easy, with a fountain show set to music, a carousel, holiday lights and a 200-foot Ferris wheel with enclosed gondolas.",tips:"Admission and parking are free; you pay only for rides and food. Restrooms are inside the shops and near the center. Ride the wheel at dusk for the light views. It is close to most cabins, so it is an easy bail-out if someone melts down.",check:"Fountain show times and ride hours are shorter in winter. Check the schedule.",verify:!1,url:"https://islandinpigeonforge.com"},{id:"cadescove",name:"Cades Cove Loop scenic drive",area:"National Park",cats:["Scenic Drive","Outdoor"],icon:"car",cost:"Free",toddler:"Great",weather:"fair",dur:240,drive:60,stroller:"partial",setting:"In the car",slot:"morning",why:"An 11-mile one-way loop you see from the car, so toddlers stay buckled, warm and free to nap. Deer and wild turkeys are common, and old cabins and churches make quick stretch stops.",tips:"Start early; traffic slows to a crawl by late morning. Restrooms are near the loop entrance and at the Cable Mill area about halfway. Pack lunch and snacks, since there is no food on the loop. A park parking tag is required if you park for more than 15 minutes.",check:"Laurel Creek Road and the loop can close for snow or ice. Check the park\u2019s road status the morning of.",verify:!1,url:"https://www.nps.gov/grsm/planyourvisit/cadescove.htm"},{id:"gatlinburgtrail",name:"Gatlinburg Trail",area:"National Park",cats:["Outdoor"],icon:"tree",cost:"Free",toddler:"Great",weather:"fair",dur:90,drive:20,stroller:"yes",setting:"Outdoor",slot:"morning",why:"One of the flattest trails in the park: a riverside path from Sugarlands toward town with a footbridge, old homestead chimneys and plenty of rocks to point at. Walk as far as little legs want, then turn back.",tips:"It runs about 1.9 miles each way, so most families do a short out-and-back. The surface is packed gravel; a stroller with bigger wheels does best, with a carrier as backup. Start at Sugarlands for restrooms. Watch for ice on the footbridge on cold mornings.",check:null,verify:!1,url:"https://www.nps.gov/grsm/"},{id:"sugarlands",name:"Sugarlands Visitor Center",area:"National Park",cats:["Indoor","Outdoor"],icon:"home",cost:"Free",toddler:"Great",weather:"any",dur:45,drive:20,stroller:"yes",setting:"Mixed",slot:"morning",why:"Warm, free and full of restrooms: natural history exhibits with bears and owls at kid height, a short park film, and an easy walk out back to little Cataract Falls.",tips:"Buy your park parking tags here. It is the best restroom and diaper stop on the way to Cades Cove or Newfound Gap.",check:"Winter hours are shorter. Check before you go.",verify:!1,url:"https://www.nps.gov/grsm/planyourvisit/visitorcenters.htm"},{id:"skylift",name:"Gatlinburg SkyLift Park & SkyBridge",area:"Gatlinburg",cats:["Outdoor","Shows/Lights"],icon:"lift",cost:"$$$",toddler:"Use carrier",weather:"fair",dur:90,drive:20,stroller:"no",setting:"Outdoor",slot:"afternoon",why:"A short chairlift up Crockett Mountain to a 680-foot suspension bridge with big views over Gatlinburg, plus light displays after dark. Toddlers love the \u201Cflying\u201D chair ride.",tips:"Strollers stay at the bottom. A front carrier keeps little ones secure on the open chairlift and the bridge. Bring blankets, because the lift is cold and breezy. The glass-floor section is optional. Judge your group\u2019s comfort with heights before buying tickets.",check:"The lift can pause for wind or ice, and winter hours vary. Confirm the day of.",verify:!1,url:"https://www.gatlinburgskylift.com"},{id:"oldmill",name:"Old Mill Square",area:"Pigeon Forge",cats:["Food","Shopping","Indoor"],icon:"mill",cost:"$$",toddler:"Great",weather:"any",dur:120,drive:15,stroller:"partial",setting:"Mixed",slot:"morning",why:"A working 1830 gristmill on the river, Southern comfort food, and a candy kitchen where kids can watch taffy being pulled in the window, plus a toy shop and a creamery.",tips:"The Old Mill Restaurant has long waits at peak meals. Go early, put your name in, and browse the shops while you wait. The Pottery House Caf\xE9 next door is a quieter option for 10. Shops are cozy and crowded, so fold the stroller or wear a carrier.",check:"Restaurant hours shift in winter. Check before you go.",verify:!1,url:"https://www.old-mill.com"},{id:"pancakes",name:"Pancake house breakfast",area:"Gatlinburg",cats:["Food","Indoor"],icon:"fork",cost:"$$",toddler:"Great",weather:"any",dur:75,drive:20,stroller:"partial",setting:"Indoor",slot:"morning",why:"A Smokies tradition, and breakfast is the easiest meal out with toddlers: they are rested, hungry and nowhere near a meltdown.",tips:"Lines build after 9 AM on weekends. For 10 people, arrive before 8:30 or ask about two tables side by side. Ask for three high chairs when you check in. Pancake Pantry and Crockett\u2019s Breakfast Camp are local favorites.",check:null,verify:!1,url:null},{id:"bucees",name:"Buc-ee's Sevierville",area:"Sevierville",cats:["Food","Shopping","Indoor"],icon:"bag",cost:"$",toddler:"Great",weather:"any",dur:40,drive:25,stroller:"yes",setting:"Indoor",slot:"afternoon",why:"Huge, spotless restrooms, a giant beaver statue for photos, and every road snack imaginable, right off I-40 at Exit 407.",tips:"Make it the diaper-change and leg-stretch stop between the airport and the cabin. Brisket sandwiches make an easy first-night dinner.",check:null,verify:!1,url:null},{id:"grocery",name:"Grocery pickup for the cabin",area:"Sevierville",cats:["Food","Shopping"],icon:"bag",cost:"$$",toddler:"Great",weather:"any",dur:45,drive:20,stroller:"na",setting:"In the car",slot:"afternoon",why:"Curbside pickup keeps the littles buckled while you stock the cabin for easy breakfasts, nap-time snacks and fewer restaurant meals with 10 people.",tips:"Order ahead from a Walmart or Kroger in Sevierville or Pigeon Forge. Add milk, diapers, wipes, night-lights and a few outlet covers to the list.",check:"January 1 is New Year\u2019s Day, so pickup windows may be limited. Book a slot early.",verify:!1,url:null},{id:"winterfest",name:"Winterfest lights drive",area:"Pigeon Forge",cats:["Shows/Lights","Scenic Drive"],icon:"sparkle",cost:"Free",toddler:"Great",weather:"any",dur:60,drive:10,stroller:"na",setting:"In the car",slot:"evening",why:"Millions of lights along the Parkway in Pigeon Forge and Gatlinburg, seen from warm car seats in pajamas. If they fall asleep on the way home, even better.",tips:"Go right after dinner, around 6 PM, and loop the Parkway. Queue up a holiday playlist.",check:"Winterfest displays usually stay up through February. Confirm this season\u2019s dates.",verify:!0,url:"https://www.mypigeonforge.com"},{id:"cabinbrunch",name:"Slow pancake brunch at the cabin",area:"Cabin",cats:["Cabin","Food"],icon:"cabin",cost:"Free",toddler:"Great",weather:"any",dur:90,drive:0,stroller:"na",setting:"Indoor",slot:"morning",why:"No car seats and no lines. Kids eat in pajamas while the grown-ups get a second cup of coffee by the window.",tips:"Let the 3-year-old help stir and add sprinkles. If the cabin has no high chairs, pack a travel booster or two.",check:null,verify:!1,url:null},{id:"cocoa",name:"Hot cocoa bar & crafts",area:"Cabin",cats:["Cabin","Indoor"],icon:"mug",cost:"Free",toddler:"Great",weather:"any",dur:60,drive:0,stroller:"na",setting:"Indoor",slot:"afternoon",why:"A warm, mess-friendly afternoon: tiny marshmallows, sticker scenes, play dough and a \u201Csnow day\u201D sensory bin.",tips:"Cool the cocoa to lukewarm for the littles and use lidded cups. A plastic tablecloth under the craft table saves the cabin\u2019s floors.",check:null,verify:!1,url:null},{id:"snowplay",name:"Snow or frost play outside",area:"Cabin",cats:["Cabin","Outdoor"],icon:"snow",cost:"Free",toddler:"Good",weather:"fair",dur:45,drive:0,stroller:"na",setting:"Outdoor",slot:"morning",why:"If it snows, 20 minutes of snowman-building right outside the door is all a toddler needs. No snow? Hunt for frost, pinecones and animal tracks.",tips:"Keep waterproof mittens and a full change of clothes by the door. Decks and steps get icy, and hillside cabins often have steep drop-offs, so keep little ones close.",check:null,verify:!1,url:null},{id:"movienight",name:"Movie night in PJs",area:"Cabin",cats:["Cabin","Indoor"],icon:"moon",cost:"Free",toddler:"Great",weather:"any",dur:90,drive:0,stroller:"na",setting:"Indoor",slot:"evening",why:"Popcorn, blankets and an early bedtime, so the grown-ups get the rest of the evening.",tips:"Pick a short movie (under an hour) for the toddlers. Bring your streaming logins; cabin TVs usually have the apps but not your accounts.",check:null,verify:!1,url:null},{id:"gamenight",name:"Grown-ups\u2019 game night",area:"Cabin",cats:["Cabin","Indoor"],icon:"cabin",cost:"Free",toddler:"Good",weather:"any",dur:120,drive:0,stroller:"na",setting:"Indoor",slot:"evening",why:"Once the littles are down, the cabin becomes the grown-ups\u2019 lodge: board games, a puzzle and the fireplace.",tips:"Set up baby monitors in each sleeping room first. If the cabin has a hot tub, keep the cover locked; hot tubs are not safe for kids under 5.",check:null,verify:!1,url:null},{id:"familyphoto",name:"Family photo by the fireplace",area:"Cabin",cats:["Cabin","Indoor"
